metadata:
  config_name: bimanual
  created_date: '2025-06-24T03:11:23.446004'
  robot_serial: PIPER_001
  description: 'Bimanual configuration for left (choupette) and right (baguette) arms'
  is_bimanual: true

# No global namespace for bimanual - use per-arm namespaces
namespace: ''

# Per-arm piper_gripper configurations
piper_gripper:
  left:
    servo_id: 1
    device: /dev/ttyACM0
    open_ticks: 1592
    close_ticks: 900
    default_torque: 1000
  right:
    servo_id: 4
    device: /dev/ttyACM1
    open_ticks: 1592
    close_ticks: 900
    default_torque: 1000

# Per-arm robot configurations with namespaced topics
robot:
  arms:
    left:
      namespace: choupette
      arm_side: left
      usb_address: 1-3.4.4.1.1:1.0
      joint_topic: /joint_ctrl_single
      joint_state_topic: /joint_states_single
      end_pose_topic: /end_pose
      arm_status_topic: /arm_status
      enable_topic: /enable_flag
      servo_topic: /servo/command_raw
    right:
      namespace: baguette
      arm_side: right
      usb_address: 1-3.4.4.1.2:1.0
      joint_topic: /joint_ctrl_single
      joint_state_topic: /joint_states_single
      end_pose_topic: /end_pose
      arm_status_topic: /arm_status
      enable_topic: /enable_flag
      servo_topic: /servo/command_raw

