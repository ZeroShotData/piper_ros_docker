metadata:
  config_name: my_setup_extended
  created_date: '2025-06-28T12:00:00.000000'
  robot_serial: PIPER_001
  description: 'Extended config with robot arm topics for LeRobot integration'

# Robot arm configuration for LeRobot
robot:
  arm_side: left
  arms:
    left:
      joint_topic: /joint_ctrl_single
      joint_state_topic: /joint_states_single
      end_pose_topic: /end_pose
      arm_status_topic: /arm_status
      enable_topic: /enable_flag
      servo_topic: /servo/command_raw

# Gripper configuration
piper_gripper:
  servo_id: 4
  device: /dev/ttyACM0
  open_ticks: 1592
  close_ticks: 900
  default_torque: 1000