services:
  puppet_os_arm64:
    image: piper:humble-amd64
    platform: linux/amd64
    container_name: piper
    environment:
      - ROS_DOMAIN_ID=0
      - ROS_LOCALHOST_ONLY=0
      - ROS_NAMESPACE=${PUPPET_ID:-robot}  # Default if not set
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    volumes:
      - ~/.ssh:/root/.ssh:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /sys/class/net:/sys/class/net:rw   # Add CAN interface access
      - /sys/devices:/sys/devices:rw       # USB/PCI devices
      - .:/app:rw  # Mount local repository for live development
      - ../PiperGello:/PiperGello:rw  # Mount PiperGello repo
    privileged: true
    # Expose required ports explicitly so tools on the host can reach
    # rosbridge (TCP 9090) and Chrony (UDP 123) without relying on
    # host-network mode (which is unsupported on some platforms).
    ports:
      - "9090:9090"      # rosbridge WebSocket
      - "123:123/udp"   # Chrony time-sync (optional)
    # If you prefer full host networking (e.g. for raw CAN access) you can
    # still uncomment the next line and remove the `ports:` block above.
    # network_mode: "host"
    cap_add:
      - NET_ADMIN  # Required for CAN interface configuration
    devices:
      - /dev/bus/usb:/dev/bus/usb
      - /dev/ttyUSB0:/dev/ttyUSB0
      - /dev/ttyACM0:/dev/ttyACM0
      - /dev/dri:/dev/dri
    restart: unless-stopped
