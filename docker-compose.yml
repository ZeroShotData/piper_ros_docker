services:
  puppet_os_arm64:
    image: piper:humble-amd64
    platform: linux/amd64
    container_name: piper
    environment:
      - ROS_DOMAIN_ID=0
      - ROS_LOCALHOST_ONLY=0
      - ROS_NAMESPACE=${PUPPET_ID:-robot}  # Default if not set
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    volumes:
      - ~/.ssh:/root/.ssh:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /sys/class/net:/sys/class/net:rw   # Add CAN interface access
      - /sys/devices:/sys/devices:rw       # USB/PCI devices
      - .:/app:rw  # Mount local repository for live development
      - ../PiperGello:/PiperGello:rw  # Mount PiperGello repo
    privileged: true
    # Host networking mode allows:
    # - Direct access to CAN devices
    # - ROS bridge server on port 9090
    # - Chrony time sync on port 123/udp
    network_mode: "host"
    cap_add:
      - NET_ADMIN  # Required for CAN interface configuration
    devices:
      - /dev/bus/usb:/dev/bus/usb
      - /dev/ttyUSB0:/dev/ttyUSB0
      - /dev/ttyACM0:/dev/ttyACM0
      - /dev/dri:/dev/dri
    restart: unless-stopped